<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Sample Size & Multi-PDF Student ID Sampler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 600; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 p-2.5 rounded-lg text-white">
          <i class="fa-solid fa-calculator text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Research Sampler & Student ID Generator</h1>
          <p class="text-xs text-slate-400">Sample Size Calculator, Manual Input & PDF Extractor</p>
        </div>
      </div>
      <div class="flex items-center space-x-2 text-xs bg-slate-800 px-3 py-1.5 rounded-full text-slate-300 border border-slate-700">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>App System Ready</span>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 flex space-x-8 overflow-x-auto">
      <button onclick="switchTab('calc')" id="tab-calc" class="tab-active py-3 px-1 text-sm flex items-center gap-2 whitespace-nowrap transition-all cursor-pointer">
        <i class="fa-solid fa-chart-pie"></i> 1. Population & Sample Size Calculator
      </button>
      <button onclick="switchTab('pdf')" id="tab-pdf" class="py-3 px-1 text-sm text-slate-500 hover:text-slate-800 flex items-center gap-2 whitespace-nowrap transition-all cursor-pointer">
        <i class="fa-solid fa-file-pdf"></i> 2. Input Student IDs (Upload / Manual)
      </button>
      <button onclick="switchTab('sampling')" id="tab-sampling" class="py-3 px-1 text-sm text-slate-500 hover:text-slate-800 flex items-center gap-2 whitespace-nowrap transition-all cursor-pointer">
        <i class="fa-solid fa-user-check"></i> 3. Random Student ID Sampler
      </button>
    </div>
  </div>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">

    <!-- TAB 1: CALCULATOR -->
    <section id="sec-calc" class="space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Controls & Input Setup -->
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
          <h2 class="text-lg font-bold text-slate-900 border-b pb-2 flex justify-between items-center">
            <span>Sampling Parameters</span>
            <button onclick="clearStrata()" class="text-xs text-rose-600 hover:underline flex items-center gap-1 font-normal cursor-pointer">
              <i class="fa-solid fa-trash"></i> Clear All Rows
            </button>
          </h2>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Formula Model</label>
            <select id="formula-select" onchange="calculateAll()" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5">
              <option value="slovin">Slovin's Formula (n = N / (1 + N * e²))</option>
              <option value="yamane">Yamane's Formula (n = N / (1 + N * e²))</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Margin of Error (e)</label>
            <div class="flex gap-2">
              <input type="number" id="margin-of-error" value="0.05" step="0.01" min="0.01" max="0.20" onchange="calculateAll()" onkeyup="calculateAll()" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5">
              <select onchange="document.getElementById('margin-of-error').value=this.value; calculateAll();" class="bg-slate-100 border border-slate-300 text-xs rounded-lg px-2">
                <option value="0.01">1%</option>
                <option value="0.03">3%</option>
                <option value="0.05" selected>5%</option>
                <option value="0.10">10%</option>
              </select>
            </div>
          </div>

          <div class="pt-2">
            <div class="flex justify-between items-center mb-2">
              <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Population Inputs</label>
              <span class="text-
